  <title>VantTEC</title>
  <!--
    Client-side redirect to hash-based routing for GitHub Pages.
  -->
  <script>
    (function () {
      try {
        var path = window.location.pathname || '/';
        // ignore root and index.html
        if (!window.location.hash && path && path !== '/' && !path.startsWith('/#') && !path.endsWith('index.html')) {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var newUrl = window.location.origin + '/#' + path + search + hash;
          if (newUrl !== window.location.href) {
            // use replace so browser history isn't cluttered
            window.location.replace(newUrl);
          }
        }
      } catch (e) {
        // fail silently
        console && console.error && console.error('hash-redirect error', e);
      }
    })();
  </script>
